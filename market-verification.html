<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Data Pedagang Pasar · e-PASAR</title><link rel="stylesheet" href="css/epasar.css"><link rel="stylesheet" href="css/internal-ui.css"></head><body>
<main class="workflow-shell">
  <header class="workflow-head">
    <div>
      <p class="eyebrow">RUANG KERJA INTERNAL</p>
      <h1>Data pedagang pasar</h1>
      <p id="who">Memeriksa akun…</p>
    </div>
    <a class="button secondary" href="admin-epasar.html">Kembali ke dashboard</a>
  </header>

  <section class="workflow-card">
    <div id="message" class="admin-message">Memuat data pasar yang ditugaskan…</div>
    
    <div class="market-workspace-tabs" role="tablist" aria-label="Data pedagang pasar">
      <button id="pendingTab" class="market-workspace-tab active" type="button" role="tab" aria-selected="true" aria-controls="pendingPanel">
        Menunggu verifikasi <span id="pendingCount">0</span>
      </button>
      <button id="directoryTab" class="market-workspace-tab" type="button" role="tab" aria-selected="false" aria-controls="directoryPanel">
        Semua data pasar <span id="directoryCount">0</span>
      </button>
    </div>

    <!-- TAB 1: MENUNGGU VERIFIKASI -->
    <section id="pendingPanel" role="tabpanel" aria-labelledby="pendingTab">
      <div id="pendingFilterToolbar" style="display:grid; grid-template-columns:minmax(200px,2fr) minmax(140px,1.2fr) minmax(130px,1fr) auto; gap:10px; background:#f8fafc; padding:12px 14px; border-radius:12px; border:1px solid #e2e8f0; margin-bottom:14px; align-items:flex-end;">
        <div>
          <label for="pendingSearch" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Cari Antrean Verifikasi</label>
          <input id="pendingSearch" type="search" autocomplete="off" placeholder="Nama, ID pedagang, atau nomor unit..." style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
        </div>
        <div>
          <label for="pendingUnitFilter" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Jenis Tempat</label>
          <select id="pendingUnitFilter" style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
            <option value="">Semua Jenis</option>
            <option value="KIOS">Kios</option>
            <option value="LOS">Los</option>
            <option value="LAPAK">Lapak</option>
            <option value="PELATARAN">Pelataran</option>
          </select>
        </div>
        <div>
          <label for="pendingMarketFilter" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Lokasi Pasar</label>
          <select id="pendingMarketFilter" style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
            <option value="">Semua Pasar Tugas</option>
          </select>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="pendingResetFilter" class="button secondary" type="button" style="min-height:38px; font-size:0.8rem; padding:0 12px; white-space:nowrap;">Reset</button>
          <span id="pendingMatchBadge" style="background:#eaf2fd; color:#0646c8; font-weight:700; font-size:0.75rem; padding:7px 12px; border-radius:8px; white-space:nowrap;">0 berkas</span>
        </div>
      </div>

      <div class="pending-master-detail">
        <div>
          <div id="pendingList" class="pending-list" aria-label="Daftar pedagang menunggu verifikasi"></div>
          <button id="pendingMore" class="button secondary market-load-more" type="button" hidden>Muat antrean berikutnya</button>
        </div>
        <div id="items" class="pending-detail" aria-live="polite"></div>
      </div>
    </section>

    <!-- TAB 2: SEMUA DATA PASAR -->
    <section id="directoryPanel" role="tabpanel" aria-labelledby="directoryTab" hidden>
      <div id="directoryFilterToolbar" style="display:grid; grid-template-columns:minmax(200px,2fr) minmax(150px,1.2fr) minmax(130px,1fr) minmax(130px,1fr) auto; gap:10px; background:#f8fafc; padding:12px 14px; border-radius:12px; border:1px solid #e2e8f0; margin-bottom:14px; align-items:flex-end;">
        <div>
          <label for="directorySearch" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Cari Data Pedagang</label>
          <input id="directorySearch" type="search" autocomplete="off" placeholder="Nama, ID pedagang, atau nomor unit..." style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
        </div>
        <div>
          <label for="directoryStatusFilter" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Status Verifikasi</label>
          <select id="directoryStatusFilter" style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
            <option value="">Semua Status</option>
            <option value="VERIFIED">TERVERIFIKASI</option>
            <option value="UNVERIFIED">MENUNGGU VERIFIKASI</option>
            <option value="CONFLICT">KONFLIK</option>
            <option value="NOT_FOUND">UNIT TIDAK DITEMUKAN</option>
            <option value="CORRECTION_REQUIRED">PERLU KOREKSI</option>
            <option value="LEGACY_REVIEW">DATA LAMA</option>
          </select>
        </div>
        <div>
          <label for="directoryUnitFilter" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Jenis Tempat</label>
          <select id="directoryUnitFilter" style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
            <option value="">Semua Jenis</option>
            <option value="KIOS">Kios</option>
            <option value="LOS">Los</option>
            <option value="LAPAK">Lapak</option>
            <option value="PELATARAN">Pelataran</option>
          </select>
        </div>
        <div>
          <label for="directoryMarketFilter" style="display:block; font-size:0.72rem; font-weight:700; color:#475569; margin-bottom:4px;">Lokasi Pasar</label>
          <select id="directoryMarketFilter" style="min-height:38px; font-size:0.85rem; padding:6px 10px; margin:0; border-radius:8px;">
            <option value="">Semua Pasar Tugas</option>
          </select>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="directoryResetFilter" class="button secondary" type="button" style="min-height:38px; font-size:0.8rem; padding:0 12px; white-space:nowrap;">Reset</button>
          <span id="directoryMatchBadge" style="background:#eaf2fd; color:#0646c8; font-weight:700; font-size:0.75rem; padding:7px 12px; border-radius:8px; white-space:nowrap;">0 pedagang</span>
        </div>
      </div>

      <div id="directoryItems"></div>
      <button id="directoryMore" class="button secondary market-load-more" type="button" hidden>Muat data berikutnya</button>
    </section>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/epasar/firebase-config.local.js"></script><script src="js/epasar/constants.js"></script><script src="js/epasar/config.js"></script><script src="js/epasar/auth-service.js"></script><script src="js/epasar/internal-shell.js"></script><script src="js/epasar/market-workspace-service.js"></script><script src="js/epasar/workflow-service.js"></script><script src="js/epasar/market-verification.js"></script>
</body></html>
