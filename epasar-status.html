<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pendataan e-PASAR</title><link rel="stylesheet" href="css/epasar.css"></head><body><main class="form-shell"><header class="page-header"><p class="eyebrow">e-PASAR PINRANG</p><h1>Cek Status Pengajuan</h1><p class="intro">Gunakan nomor registrasi dan token pribadi yang diterima setelah mengirim data.</p></header><form id="statusForm" novalidate><label>Nomor registrasi<input id="registrationCode" maxlength="40" required></label><label>Token pribadi<input id="publicToken" maxlength="128" autocomplete="off" required><small>Jangan membagikan token ini kepada orang lain.</small></label><p id="statusError" class="form-error" role="alert"></p><button class="button primary" type="submit">Cek Status</button></form><section id="statusResult" class="success-panel" hidden></section><section id="correctionPanel" class="form-step is-active" hidden><h2>Ajukan Koreksi Data</h2><p class="step-help">Koreksi tidak langsung mengubah data induk dan akan diperiksa petugas.</p><form id="correctionForm"><label>Bagian yang dikoreksi<select id="correctionSection" required><option value="">Pilih bagian</option><option value="name">Identitas/nama</option><option value="phone">Nomor telepon</option><option value="business">Data usaha</option><option value="location">Lokasi usaha umum</option><option value="marketUnit">Data tempat pasar</option></select></label><label id="marketRouteWrap" hidden>Tempat pasar<select id="marketRoute"></select></label><label>Data yang seharusnya<textarea id="correctionValue" maxlength="2000" required></textarea></label><label>Alasan koreksi<textarea id="correctionReason" maxlength="500" required></textarea></label><p id="correctionMessage" class="form-error" role="alert"></p><button class="button primary" type="submit">Kirim Permohonan Koreksi</button></form></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/epasar/firebase-config.local.js"></script><script src="js/epasar/config.js"></script><script src="js/epasar/status-service.js"></script><script src="js/epasar/correction-service.js"></script><script src="js/epasar/status-ui.js"></script></body></html>
