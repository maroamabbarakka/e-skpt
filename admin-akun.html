<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kelola Akun | e-PASAR</title><link rel="stylesheet" href="css/epasar.css"><link rel="stylesheet" href="css/internal-ui.css"></head><body>
<main class="account-shell"><header class="account-head"><div><p class="eyebrow">KHUSUS SUPER ADMIN</p><h1>Kelola Akun Petugas</h1><p class="intro">Atur profil jabatan, role, status, dan penugasan pasar.</p></div><button class="button primary" id="openAccountEditor" type="button">+ Tambah Petugas</button></header><div id="accountMessage" class="admin-message">Memeriksa akses…</div><section id="accountWorkspace" hidden><article class="account-card"><h2>Daftar Petugas</h2><p class="account-info">Klik salah satu petugas untuk memperbarui profil dan kewenangannya.</p><div id="accountList" class="account-list">Memuat…</div></article>
<aside class="account-card account-editor" id="accountEditor" aria-hidden="true"><header><div><p class="eyebrow">PROFIL PETUGAS</p><h2 id="formTitle">Profil Baru</h2></div><button class="internal-icon-button" id="closeAccountEditor" type="button" aria-label="Tutup">×</button></header><form id="accountForm" class="account-form"><label>UID Firebase<input id="uid" required placeholder="UID dari Firebase Authentication"></label><label>Username jabatan<input id="username" placeholder="kepala.pasar"></label><label>Nama tampilan<input id="displayName" required placeholder="Kepala Pasar"></label><label>Jabatan<input id="position" required placeholder="Kepala Pasar"></label><label>Role<select id="role"><option>DISPERINDAG_ADMIN</option><option>TRADE_ADMIN</option><option>MARKET_ADMIN</option><option>MARKET_HEAD</option><option>KADIS</option><option>TECH_ADMIN</option><option>SUPER_ADMIN</option></select></label><label>ID pasar yang ditugaskan<input id="marketIds" list="marketIdOptions" placeholder="Contoh: MKT-010"><small>Wajib untuk Kepala Pasar. Pisahkan beberapa ID dengan koma.</small></label><datalist id="marketIdOptions"></datalist><label>Status<select id="status"><option>ACTIVE</option><option>INACTIVE</option></select></label><label>WhatsApp/HP<input id="phone" type="tel"></label><p id="accountError" class="account-error"></p><div class="form-actions"><button class="button secondary" id="clearForm" type="button">Kosongkan</button><button class="button primary" type="submit">Simpan Profil</button></div></form></aside><button class="account-editor-scrim" id="accountEditorScrim" type="button" aria-label="Tutup editor"></button></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/epasar/firebase-config.local.js"></script><script src="js/epasar/constants.js"></script><script src="js/epasar/config.js"></script><script src="js/epasar/auth-service.js"></script><script src="js/epasar/internal-shell.js"></script><script src="js/epasar/account-service.js"></script><script src="js/epasar/admin-accounts.js"></script></body></html>
