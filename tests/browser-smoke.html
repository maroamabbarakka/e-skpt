<!doctype html><meta charset="utf-8"><title>e-PASAR browser smoke</title><pre id="result">RUNNING</pre>
<script src="../js/epasar/image-compress.js"></script><script src="../js/epasar/validators.js"></script>
<script>
(async()=>{const out=[];const pass=(name,ok)=>out.push(`${ok?'PASS':'FAIL'} ${name}`);try{pass('NIK valid',window.EPASAR_VALIDATORS.nik('7315010101010001'));pass('NIK invalid rejected',!window.EPASAR_VALIDATORS.nik('123'));pass('phone valid',window.EPASAR_VALIDATORS.phone('081234567890'));const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=900;const ctx=canvas.getContext('2d');ctx.fillStyle='#1261a0';ctx.fillRect(0,0,1200,900);const file=await new Promise(resolve=>canvas.toBlob(blob=>resolve(new File([blob],'smoke.png',{type:'image/png'})),'image/png'));const result=await window.EPASAR_IMAGE.compressImage(file,'profile');pass('WebP output',result.mime==='image/webp');pass('profile hard cap',result.binaryBytes<=55000);pass('dimensions capped',result.width<=800&&result.height<=800);pass('Base64 present',result.dataBase64.length>0);pass('metadata bytes',result.base64Bytes===result.dataBase64.length)}catch(error){out.push(`FAIL ${error.message}`)}document.getElementById('result').textContent=out.join('\n')})()
</script>
